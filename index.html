<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Relative paths only, so the site works from any static host and under a sub-path (R23.3, R24.7). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="theme-color" content="#FFFBF2" />
    <title>Naqsha</title>
    <script>
      (function () {
        var theme = null;
        try { var stored = localStorage.getItem('naqsha.theme'); if (stored === 'day' || stored === 'night') theme = stored; } catch (e) {}
        if (theme === null) { try { theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day'; } catch (e) { theme = 'day'; } }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
